prometheus_url: "http://localhost:9090"
alertmanager_url: "http://localhost:9093"

blast_radius:
  max_actions_per_minute: 2
  max_restarts_per_service_per_hour: 5

runbook_registry:
  - "runbooks/restart_service.sh"
  - "runbooks/clear_cache.sh"
  - "runbooks/scale_replicas.sh"
  - "runbooks/multi_step_deploy.sh" 

runbook_map:
  HighLatency: "runbooks/restart_service.sh"
  HighErrorRate: "runbooks/clear_cache.sh"
  InstanceDown: "runbooks/restart_service.sh"
  TestHallucination: "runbooks/nonexistent_runbook.sh"
  HighDeploymentError: "runbooks/multi_step_deploy.sh"

rollback_map:
  HighLatency: "runbooks/restart_service.sh"
  HighErrorRate: "runbooks/clear_cache.sh"
  InstanceDown: "runbooks/restart_service.sh"

verify_thresholds:
  latency_p99_max_ms: 200
  error_rate_max_pct: 10.0
  up_required: 1
  verify_timeout_seconds: 60
  verify_poll_interval_seconds: 10
  verify_min_samples: 3

prometheus_queries:
  HighLatency: "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"{service}\"}[1m])) * 1000"
  HighErrorRate: "rate(http_errors_total{service=\"{service}\"}[2m]) / (rate(http_requests_total{service=\"{service}\"}[2m]) + 0.001) * 100"
  InstanceDown: "up{job=\"{service}\"}"