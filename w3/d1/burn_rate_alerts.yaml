groups:
  - name: frontend-slo
    rules:
      - alert: frontend_burn_rate_tier1
        expr: |
          ((sum(rate(frontend_rum_events_total[1h])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[1h]))) / sum(rate(frontend_rum_events_total[1h]))) / (1 - 0.995) >= 2.0
          AND
          ((sum(rate(frontend_rum_events_total[5m])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[5m]))) / sum(rate(frontend_rum_events_total[5m]))) / (1 - 0.995) >= 2.0
        labels: { severity: page, tier: "1" }
        annotations: { summary: "Frontend critical burn rate high" }

      - alert: frontend_burn_rate_tier2
        expr: |
          ((sum(rate(frontend_rum_events_total[6h])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[6h]))) / sum(rate(frontend_rum_events_total[6h]))) / (1 - 0.995) >= 1.1
          AND
          ((sum(rate(frontend_rum_events_total[30m])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[30m]))) / sum(rate(frontend_rum_events_total[30m]))) / (1 - 0.995) >= 1.1
        labels: { severity: page, tier: "2" }
        annotations: { summary: "Frontend warning burn rate high" }

      - alert: frontend_burn_rate_tier3
        expr: |
          ((sum(rate(frontend_rum_events_total[3d])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[3d]))) / sum(rate(frontend_rum_events_total[3d]))) / (1 - 0.995) >= 1.0
          AND
          ((sum(rate(frontend_rum_events_total[6h])) - sum(rate(frontend_rum_events_total{network_error="false", js_error="false"}[6h]))) / sum(rate(frontend_rum_events_total[6h]))) / (1 - 0.995) >= 1.0
        labels: { severity: ticket, tier: "3" }
        annotations: { summary: "Frontend slow burn rate warning" }

  - name: api-slo
    rules:
      - alert: api_burn_rate_tier1
        expr: |
          (sum(rate(http_requests_total{status=~"5..|429"}[1h])) / sum(rate(http_requests_total[1h]))) / (1 - 0.997) >= 2.0
          AND
          (sum(rate(http_requests_total{status=~"5..|429"}[5m])) / sum(rate(http_requests_total[5m]))) / (1 - 0.997) >= 2.0
        labels: { severity: page, tier: "1" }
        annotations: { summary: "API critical burn rate high" }
      - alert: api_burn_rate_tier2
        expr: |
          (sum(rate(http_requests_total{status=~"5..|429"}[6h])) / sum(rate(http_requests_total[6h]))) / (1 - 0.997) >= 1.1
          AND
          (sum(rate(http_requests_total{status=~"5..|429"}[30m])) / sum(rate(http_requests_total[30m]))) / (1 - 0.997) >= 1.1
        labels: { severity: page, tier: "2" }
        annotations: { summary: "API warning burn rate high" }
      - alert: api_burn_rate_tier3
        expr: |
          (sum(rate(http_requests_total{status=~"5..|429"}[3d])) / sum(rate(http_requests_total[3d]))) / (1 - 0.997) >= 1.0
          AND
          (sum(rate(http_requests_total{status=~"5..|429"}[6h])) / sum(rate(http_requests_total[6h]))) / (1 - 0.997) >= 1.0
        labels: { severity: ticket, tier: "3" }
        annotations: { summary: "API slow burn rate warning" }

  - name: db-slo
    rules:
      - alert: db_burn_rate_tier1
        expr: |
          (sum(rate(db_queries_total{success="false"}[1h])) / sum(rate(db_queries_total[1h]))) / (1 - 0.998) >= 2.0
          AND
          (sum(rate(db_queries_total{success="false"}[5m])) / sum(rate(db_queries_total[5m]))) / (1 - 0.998) >= 2.0
        labels: { severity: page, tier: "1" }
        annotations: { summary: "DB critical burn rate high" }

      - alert: db_burn_rate_tier2
        expr: |
          (sum(rate(db_queries_total{success="false"}[6h])) / sum(rate(db_queries_total[6h]))) / (1 - 0.998) >= 1.1
          AND
          (sum(rate(db_queries_total{success="false"}[30m])) / sum(rate(db_queries_total[30m]))) / (1 - 0.998) >= 1.1
        labels: { severity: page, tier: "2" }
        annotations: { summary: "DB warning burn rate high" }

      - alert: db_burn_rate_tier3
        expr: |
          (sum(rate(db_queries_total{success="false"}[3d])) / sum(rate(db_queries_total[3d]))) / (1 - 0.998) >= 1.0
          AND
          (sum(rate(db_queries_total{success="false"}[6h])) / sum(rate(db_queries_total[6h]))) / (1 - 0.998) >= 1.0
        labels: { severity: ticket, tier: "3" }
        annotations: { summary: "DB slow burn rate warning" }